project:
  type: website
  output-dir: _site
  resources:
    - assets/images/**
    - assets/cv/**
  render:
    - index.qmd
    - zh/index.qmd
    - personal/index.qmd
    - personal/en/index.qmd
    - personal/en/poetry/index.qmd
    - personal/en/artwork/index.qmd
    - personal/en/copyright/index.qmd
    - personal/poetry/index.qmd
    - personal/artwork/index.qmd
    - personal/copyright/index.qmd
    - 404.qmd

website:
  title: "Ke (Mark) Ma"
  site-url: "https://mark-ke-ma.github.io"
  description: "The academic and personal website of Ke (Mark) Ma."
  favicon: assets/brand/monogram.svg
  page-navigation: true
  search: false
  navbar: false
  open-graph: true
  twitter-card: true

format:
  html:
    theme: none
    css: assets/styles/site.css
    toc: false
    anchor-sections: false
    smooth-scroll: true
    include-in-header:
      - _includes/head.html
    include-before-body:
      - _includes/site-header.html
    include-after-body:
      - _includes/site-footer.html

execute:
  freeze: auto
